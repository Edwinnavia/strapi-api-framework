name: Pytest + Allure Report

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Tipo de test (default, api, login, etc)'
        required: false
        default: ''
      marker:
        description: 'Marker opcional (e.g. smoke, regression)'
        required: false
        default: ''

jobs:
  autotests:
    name: Run Pytest + Allure and Deploy Report
    runs-on: ubuntu-latest

    env:
      BASE_URI: ${{ secrets.BASE_URI }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with optional marker
        run: |
          echo "Running tests..."
          CMD="pytest --alluredir=allure-results"

          if [ -n "${{ github.event.inputs.marker }}" ]; then
            CMD="$CMD -m '${{ github.event.inputs.marker }}'"
          fi

          echo "Executing: $CMD"
          eval $CMD
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-history
        continue-on-error: true

      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Allure raw results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
