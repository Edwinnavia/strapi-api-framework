name: Pytest + Allure Report (Manual + Auto)

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:
    inputs:
      marker:
        description: 'Pytest marker opcional (e.g. smoke, regression)'
        required: false
        default: ''

jobs:
  autotests:
    name: Run Pytest + Generate Allure Report
    runs-on: ubuntu-latest

    env:
      BASE_URI: ${{ secrets.BASE_URI }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with Pytest + Allure
        run: |
          CMD="pytest --alluredir=allure-results"
          if [ -n "${{ github.event.inputs.marker }}" ]; then
            CMD="$CMD -m '${{ github.event.inputs.marker }}'"
          fi
          echo "Running: $CMD"
          eval $CMD
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -xvzf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Checkout gh-pages branch to get history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-history

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report
          cp -r allure-history/history allure-report/ || echo "No previous history to copy"
          cp -r allure-report history || echo "No new history to copy"
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Allure Results (Optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
